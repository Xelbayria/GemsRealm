plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.11.+" apply false
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id "com.hypherionmc.modutils.modpublisher" version "2.2.3" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = mod_id
    version = mod_version
    group = maven_group

    repositories {

        flatDir {
            dirs 'mods'
        }

        mavenLocal()

        // Our publishing repo
        maven { url = "https://registry.somethingcatchy.net/repository/maven-releases/" }

        maven { url = "https://maven.parchmentmc.org" }

        maven {
            url = "https://www.cursemaven.com"
            allowInsecureProtocol = true
        }
        maven { url = "https://api.modrinth.com/maven" }
        maven { url = 'https://jitpack.io' } // BCLib
        maven { url = "https://mvn.devos.one/snapshots/" }
        maven { url = "https://mvn.devos.one/releases" } // Porting Lib Releases
        maven { url = "https://maven.shedaniel.me/" } // Cloth Config
        maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
        maven { url = "https://maven.tterrag.com" } // Registrate
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // Forge Config API Port
        maven { url = "https://squiddev.cc/maven" } // CC: Tweaked
        maven { url = 'https://maven.ladysnake.org/releases' } // Unknown
        maven { url = "https://maven.blamejared.com/" } // JEI
        maven { url = "https://maven.teamresourceful.com/repository/maven-public/" } // Chipped
        maven { url = "https://maven.terraformersmc.com/releases" } // Unknown (for fabric)
        maven { url  = "https://raw.githubusercontent.com/moddingplayground/maven/main/" } // Unknown (for fabric)
//        maven { url = "https://modmaven.dev" } // FALLBACK for others including Botania, JEI
        // Reach Entity Attributes
        maven {
            url = "https://maven.jamieswhiteshirt.com/libs-release"
            content { includeGroup("com.jamieswhiteshirt") }
        }

        maven {
            url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
            content {
                includeGroupByRegex("software\\.bernie.*")
                includeGroup("com.eliotlash.mclib")
            }
        } // GeckoLib
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
    }
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "com.hypherionmc.modutils.modpublisher"
    apply plugin: "com.gradleup.shadow"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:$minecraft_version"
        // The following line declares the mojmap mappings, you may use other mappings as well
        mappings loom.layered() {
            it.officialMojangMappings {
                setNameSyntheticMembers(false)
            }
            it.parchment("org.parchmentmc.data:parchment-$parchment_version")
        }
    }

    publishing {
        repositories {
            mavenLocal()

            def nexusToken = providers.environmentVariable("NEXUS_TOKEN").getOrElse("")
            def nexusUser = providers.environmentVariable("NEXUS_USER").getOrElse("")
            if (!nexusToken.isEmpty() && !nexusUser.isEmpty()) {
                maven {
                    url = uri("https://registry.somethingcatchy.net/repository/maven-releases/")
                    credentials {
                        username = nexusUser
                        password = nexusToken
                    }
                }
            }
        }
    }

    var env = System.getenv()
    var modLoader = name

    var changelogFile = rootProject.file("changelog.md")
    var changelogText = changelogFile.exists() ? changelogFile.text : ""

    publisher {
        apiKeys {
            modrinth env.MODRINTH_TOKEN ?: ""
            curseforge env.CURSEFORGE_TOKEN ?: ""
        }

//        setDebug(true)

        setModrinthID(modrinth_id)
        setCurseID(curseforge_id)

        setGameVersions(minecraft_version)
        setLoaders(modLoader)
        setChangelog(changelogText)
        setProjectVersion("${mod_version}-${modLoader}")
        setVersionType(release_type)
        setCurseEnvironment("both")

        setArtifact(tasks.remapJar)
        addAdditionalFile(tasks.remapSourcesJar)

        if (modLoader == "fabric") {
            setDisplayName("${mod_id}-${mod_version}-fabric")
            modrinthDepends {
                required("fabric-api", "moonlight", "every-compat")
            }

            curseDepends {
                required("fabric-api", "selene", "every-compat")

                optional("create-fabric")
                optional("macaws-bridges")
                optional("macaws-fences-and-walls")
                optional("macaws-windows")
                optional("more-beautiful-torches")

            }
        }
        //!! FORGE
        else {
            setDisplayName("${mod_id}-${mod_version}-forge")
            modrinthDepends {
                required("moonlight", "every-compat")
            }

            curseDepends {
                required("selene", "every-compat")

                optional("create")
                optional("lapidarist")
                optional("macaws-bridges")
                optional("macaws-fences-and-walls")
                optional("macaws-windows")
                optional("more-beautiful-bookshelves")
                optional("more-beautiful-torches")

            }
        }
    }

}

tasks.register('buildAndPublishAll') {
    dependsOn ':clean'
    dependsOn ':common:clean'
    dependsOn ':fabric:clean'
    dependsOn ':forge:clean'
    dependsOn ':build'
    dependsOn ':fabric:publishMod'
    dependsOn ':forge:publishMod'
    dependsOn ':publish'
    finalizedBy 'gitTag'

    group = 'build'
    description = 'Runs clean, build, and publish neoforge and fabric'
}

tasks.register('gitTag') {
    group = 'release'
    description = 'Create and push git tag from project version'

    doLast {
        def execOps = services.get(ExecOperations)
        def tag = project.version.toString()

        // check if tag already exists
        def stdout = new ByteArrayOutputStream()
        execOps.exec {
            commandLine 'git', 'tag', '-l', tag
            standardOutput = stdout
        }

        if (!stdout.toString().trim().isEmpty()) {
            logger.warn("Git tag '${tag}' already exists")
        } else {

            // create annotated tag
            execOps.exec {
                commandLine 'git', 'tag', '-a', tag, '-m', "Release ${tag}"
            }

            // push tag
            execOps.exec {
                commandLine 'git', 'push', 'origin', tag
            }
        }
    }
}

tasks.register('cleanLogs', Delete) {
    group "build"
    description "Delete logs"

    // Logs
    delete fileTree(dir: "$rootDir/forge/run/logs", include: "**/*.gz")
    delete fileTree(dir: "$rootDir/fabric/run/logs", include: "**/*.gz")
}

tasks.register('cleanFolders', Delete) {
    group "build"
    description "Clean logs & Delete folders of Debug, Dynamic Pack"

    // Logs
    delete fileTree(dir: "$rootDir/forge/run/logs", include: "**/*.gz")
    delete fileTree(dir: "$rootDir/fabric/run/logs", include: "**/*.gz")

    // Debug
    delete "$rootDir/forge/run/debug"
    delete "$rootDir/fabric/run/debug"

    // Dynamic Data Pack Cache
    delete "$rootDir/forge/run/dynamic-data-pack-cache"
    delete "$rootDir/fabric/run/dynamic-data-pack-cache"

    // Dynamic Resource Pack Cache
    delete "$rootDir/forge/run/dynamic-resource-pack-cache"
    delete "$rootDir/fabric/run/dynamic-resource-pack-cache"
}